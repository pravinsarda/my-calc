name: CI/CD

# WHEN does this pipeline run?
on:
  push:
    branches: [main]      # every push to main -> test + deliver
  pull_request:           # every pull request  -> test only

# What the pipeline is allowed to do with your repo
permissions:
  contents: read
  packages: write         # needed to push the image to GitHub Container Registry

jobs:
  # ---------------- CI: Continuous Integration ----------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the test image
        run: docker build --target test -t mycalc-test .

      - name: Run lint + tests inside the container
        run: docker run --rm mycalc-test

  # ---------------- CD: Continuous Delivery ----------------
  deliver:
    needs: test                                   # only runs if 'test' passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, no setup needed

      - name: Build and push the runtime image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}     # ,, = lowercase (registry requires it)
          docker build --target runtime -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA::7} .
          docker push --all-tags $IMAGE
